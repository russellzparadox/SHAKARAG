{% extends "chat/base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn wide">Sign up</button>
  </form>
  <p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a>.</p>
</div>
{% endblock %}
