services:
  shakarag:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    image: shakarag:latest
    container_name: shakarag_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "*"          # tighten to your server name in prod
      # CHROMA_DIR comes from .env (e.g. .chroma_Shaka), resolved against /app
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:20128/v1}  # localhost inside container = itself
      # persistent state lives OUTSIDE the code tree so rebuilds pick up new code
      DJANGO_DB_PATH: /data/db/db.sqlite3
      DJANGO_LOGS_DIR: /data/logs
    ports:
      - "${SHAKARAG_PORT:-8111}:8111"
    volumes:
      - shakarag_data:/data                       # sqlite db + logs (survive rebuilds)
      - ./.chroma_Shaka:/app/.chroma_Shaka        # schema vector index (host-built)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets DB_HOST=host.docker.internal reach LAN servers
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8111/accounts/login/', timeout=5)\""]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

volumes:
  shakarag_data:
