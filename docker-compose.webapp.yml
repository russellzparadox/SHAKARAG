services:
  shakarag:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    image: shakarag:latest
    container_name: shakarag_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "*"          # tighten to your server name in prod
      CHROMA_DIR: /data/chroma           # shared index storage inside container
    ports:
      - "${SHAKARAG_PORT:-8111}:8111"
    volumes:
      - shakarag_web_data:/app/webapp    # sqlite db (users, profiles, chat history)
      - shakarag_chroma:/data/chroma     # schema vector index
      - shakarag_logs:/app/webapp/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets DB_HOST=host.docker.internal reach LAN servers
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8111/accounts/login/', timeout=5)\""]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

volumes:
  shakarag_web_data:
  shakarag_chroma:
  shakarag_logs:
